<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark Charcoal Rounded Background -->
  <rect width="32" height="32" rx="4" fill="#111110"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="3.5" stroke="#262522"/>
  
  <!-- Outer Compass Ring -->
  <circle cx="16" cy="16" r="10" stroke="#D2A52C" stroke-width="1.8"/>
  
  <!-- Dial Needles -->
  <polygon points="16,8.5 19,16 16,14" fill="#D2A52C"/>
  <polygon points="16,23.5 13,16 16,18" fill="#D2A52C" opacity="0.6"/>
  <polygon points="16,8.5 13,16 16,14" fill="#E3B53B"/>
  <polygon points="16,23.5 19,16 16,18" fill="#A5A095" opacity="0.5"/>
  
  <!-- Center Pivot -->
  <circle cx="16" cy="16" r="1.5" fill="#111110" stroke="#D2A52C" stroke-width="1.2"/>
</svg>
